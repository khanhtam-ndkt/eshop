spring.application.name=eshop

# In-memory H2 for tests, so the suite runs without a local MySQL instance.
# Overrides src/main/resources/application.properties (test-classes precedes
# classes on the Maven test classpath).
spring.datasource.url=jdbc:h2:mem:eshop-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect